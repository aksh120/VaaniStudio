appId: com.vaanistudio.desktop
productName: Vaani Studio
copyright: Copyright 2026 Vaani Studio Contributors

directories:
  output: dist-release
  buildResources: build

files:
  - dist/**
  - dist-electron/**
  - package.json

win:
  icon: assets/icons/icon.ico
  legalTrademarks: Vaani Studio
  requestedExecutionLevel: asInvoker
  cscLink: certs/vaani-codesign.pfx
  cscKeyPassword: VaaniStudio2026!
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  fileAssociations:
    - ext: vsp
      name: Vaani Studio Project
      description: Vaani Studio Subtitle Project File
      role: Editor

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Vaani Studio
  uninstallDisplayName: Vaani Studio
  deleteAppDataOnUninstall: false
  differentialPackage: false
  artifactName: VaaniStudio-Setup-${version}.exe

portable:
  artifactName: VaaniStudio-Portable-${version}.exe

publish: null

linux:
  maintainer: "Vaani Studio Contributors <contributors@vaanistudio.org>"
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: AudioVideo
  synopsis: Free local-first AI subtitle studio
  description: Local-first AI subtitle generator and video burn-in studio with faster-whisper speech recognition and custom typography styling.
  artifactName: VaaniStudio-${version}.${ext}



