appId: com.vaanistudio.desktop
productName: Vaani Studio
copyright: Copyright 2026 Akshat Apoorv

directories:
  output: dist-release
  buildResources: build

files:
  - dist/**
  - dist-electron/**
  - assets/**
  - package.json

asarUnpack:
  - "dist-electron/main/worker.py"

win:
  icon: assets/icons/icon.ico
  legalTrademarks: Vaani Studio
  requestedExecutionLevel: asInvoker
  cscLink: ***REMOVED-PATH***
  cscKeyPassword: ***REMOVED-SECRET***
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  fileAssociations:
    - ext: vsp
      name: Vaani Studio Project
      description: Vaani Studio Subtitle Project File
      role: Editor

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Vaani Studio
  uninstallDisplayName: Vaani Studio
  deleteAppDataOnUninstall: false
  differentialPackage: false
  installerIcon: assets/icons/icon.ico
  uninstallerIcon: assets/icons/icon.ico
  installerHeader: assets/branding/installer-header.bmp
  installerSidebar: assets/branding/installer-sidebar.bmp
  uninstallerSidebar: assets/branding/installer-sidebar.bmp
  include: assets/branding/installer.nsh
  artifactName: VaaniStudio-Setup-${version}.exe

portable:
  artifactName: VaaniStudio-Portable-${version}.exe
  requestExecutionLevel: asInvoker

publish: null

linux:
  maintainer: "Akshat Apoorv <records.akshat@gmail.com>"
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: AudioVideo
  synopsis: Free local-first AI subtitle studio
  description: Local-first AI subtitle generator and video burn-in studio with faster-whisper speech recognition and custom typography styling.
  artifactName: VaaniStudio-${version}.${ext}



